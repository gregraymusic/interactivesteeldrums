<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Interactive Steel Pan</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --pan-border: #334155;
      --pan-surface: #1e293b;
      --note-bg: #334155;
      --note-hover: #475569;
      --note-active: #0284c7;
      --text-color: #f8fafc;
      --sidebar-bg: #1e293b;
      --sidebar-border: #334155;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* Dynamic viewport height fix for mobile browsers */
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: var(--bg-color);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      touch-action: none;
    }

    /* Collapsible Sidebar */
    .sidebar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 260px;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--sidebar-border);
      z-index: 100;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 4px 0 20px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
    }

    .sidebar.collapsed {
      transform: translateX(-100%);
    }

    .sidebar-header {
      padding: 20px;
      padding-top: max(20px, env(safe-area-inset-top));
      border-bottom: 1px solid var(--sidebar-border);
      color: #f1f5f9;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .sidebar-content {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
      color: #cbd5e1;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .setting-item.row {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      width: 100%;
    }

    .drum-btn {
      background-color: #0f172a;
      color: #cbd5e1;
      border: 1px solid var(--sidebar-border);
      border-radius: 6px;
      padding: 8px 4px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s, border-color 0.2s;
      text-align: center;
    }

    .drum-btn:hover {
      background-color: #334155;
      color: #f8fafc;
    }

    .drum-btn.active {
      background-color: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }

    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #475569;
      transition: .2s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #0284c7;
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    .sidebar-toggle-btn {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      left: 260px;
      z-index: 101;
      background-color: var(--sidebar-bg);
      border: 1px solid var(--sidebar-border);
      border-left: none;
      color: #cbd5e1;
      padding: 0 10px;
      height: 42px;
      border-radius: 0 8px 8px 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s, color 0.2s;
      box-shadow: 4px 0 10px rgba(0, 0, 0, 0.2);
    }

    .sidebar.collapsed + .sidebar-toggle-btn {
      left: 0;
    }

    .sidebar-toggle-btn:hover {
      background-color: #334155;
      color: #f8fafc;
    }

    .sidebar-toggle-btn svg {
      width: 18px;
      height: 18px;
    }

    .sidebar-toggle-btn .arrow-icon {
      transition: transform 0.3s;
    }

    .sidebar.collapsed + .sidebar-toggle-btn .arrow-icon {
      transform: rotate(180deg);
    }

    .main-container {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    .header {
      width: 100%;
      padding-top: 12px;
      text-align: center;
      z-index: 10;
    }

    .header h1 {
      margin: 0;
      font-size: min(2.2rem, 5vw);
      color: #f1f5f9;
      letter-spacing: -0.025em;
    }

    .pan-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
      flex: 1;
      padding: 10px;
      min-height: 0;
    }

    .pan-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .single-layout .pan-wrapper {
      width: min(72dvh, 85vw);
      height: min(72dvh, 85vw);
    }

    .dual-layout .pan-wrapper {
      width: min(65dvh, 44vw);
      height: min(65dvh, 44vw);
    }

    .triple-layout {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .triple-layout .pan-wrapper {
      position: absolute;
      width: 30vmin;
      height: 30vmin;
    }

    .triple-layout .pan-wrapper:nth-child(1) { transform: translate(-25vmin, 9vmin); }
    .triple-layout .pan-wrapper:nth-child(2) { transform: translate(0vmin, -15vmin); }
    .triple-layout .pan-wrapper:nth-child(3) { transform: translate(25vmin, 9vmin); }

    .bass-layout {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .bass-layout .pan-wrapper {
      position: absolute;
      width: 20vmin;
      height: 20vmin;
    }

    .bass-layout .pan-wrapper:nth-child(1) { transform: translate(-22vmin, -2vmin); }
    .bass-layout .pan-wrapper:nth-child(2) { transform: translate(-11.5vmin, -20.5vmin); }
    .bass-layout .pan-wrapper:nth-child(3) { transform: translate(11.5vmin, -20.5vmin); }
    .bass-layout .pan-wrapper:nth-child(4) { transform: translate(22vmin, -2vmin); }
    .bass-layout .pan-wrapper:nth-child(5) { transform: translate(-11.5vmin, 16.5vmin); }
    .bass-layout .pan-wrapper:nth-child(6) { transform: translate(11.5vmin, 16.5vmin); }

    .steel-pan {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #334155, #0f172a 70%);
      border: min(8px, 1.2vw) solid #475569;
      box-shadow: inset 0 0 35px rgba(0,0,0,0.8), 0 12px 30px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    .note-pad {
      position: absolute;
      background: radial-gradient(circle, #334155 0%, #1e293b 100%);
      border: 2px solid #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-color);
      font-weight: 700;
      cursor: pointer;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.1), 0 4px 8px rgba(0,0,0,0.3);
      transition: background-color 0.05s ease, border-color 0.1s ease;
      border-radius: 50%;
      z-index: 2;
    }

    .note-slice {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: 1;
      pointer-events: none;
    }

    .note-slice path {
      fill: #1e293b;
      stroke: #64748b;
      stroke-width: 2;
      cursor: pointer;
      pointer-events: fill;
      transition: fill 0.05s ease, stroke 0.1s ease;
    }

    .note-slice text {
      fill: var(--text-color);
      font-weight: 700;
      pointer-events: none;
    }

    .note-pad:hover, .note-slice path:hover {
      background: #475569;
      fill: #334155;
      border-color: #38bdf8;
      stroke: #38bdf8;
    }

    .note-pad.active, .note-slice.active path {
      background: var(--note-active) !important;
      fill: var(--note-active) !important;
      border-color: #38bdf8 !important;
      stroke: #38bdf8 !important;
      box-shadow: 0 0 18px #0284c7;
    }

    .note-label {
      pointer-events: none;
    }

    .ring-outer { width: 17%; height: 14.5%; font-size: min(1.8dvh, 2.2vw); }
    .ring-mid   { width: 10.5%; height: 6.8%; font-size: min(1.3dvh, 1.6vw); }
    .ring-inner { width: 6.5%; height: 6.5%; font-size: min(1.1dvh, 1.3vw); }

    .footer-note {
      padding-bottom: 8px;
      color: #94a3b8;
      font-size: 0.9rem;
      text-align: center;
      width: 100%;
      z-index: 10;
    }

    #layoutLabel {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      font-size: 2.5vmin;
      font-weight: 800;
      color: #334155;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      pointer-events: none;
      z-index: 0;
      display: none;
    }
  </style>
</head>

    <div class="sidebar-content">

          <button class="drum-btn" data-drum="doubles">Doubles</button>
          <button class="drum-btn" data-drum="triples">Triples</button>
          <button class="drum-btn" data-drum="bass">Bass</button>
        </div>
      </div>

      <div class="setting-item row">
        <span>Octave #</span>
        <label class="toggle-switch">
          <input type="checkbox" id="toggleOctaves" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </aside>

      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>

    const bassPansNotes = [
      [
        { name: 'E2', freq: 82.41, startA: 120, endA: 240, lblR: 30, lblA: 180 },

        { name: 'C2', freq: 65.41, startA: 60, endA: 180, lblR: 30, lblA: 120 }
      ],

      ],
      [

        { name: 'B♭1', freq: 58.27, startA: -50, endA: 70, lblR: 30, lblA: 10 },
        { name: 'F2', freq: 87.31, startA: 70, endA: 190, lblR: 30, lblA: 130 }
      ],
      [
        { name: 'E♭2', freq: 77.78, startA: -120, endA: 0, lblR: 30, lblA: -60 },

    let audioCtx = null;
    let masterGain = null;
    let limiter = null;
    let showOctaves = true;
    let currentDrumType = 'lead';
    let currentActiveNotes = [];

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.35;

        limiter = audioCtx.createDynamicsCompressor();
        limiter.threshold.setValueAtTime(-3, audioCtx.currentTime);
        limiter.knee.setValueAtTime(0, audioCtx.currentTime);
        limiter.ratio.setValueAtTime(20, audioCtx.currentTime);
        limiter.attack.setValueAtTime(0.001, audioCtx.currentTime);
        limiter.release.setValueAtTime(0.05, audioCtx.currentTime);

        masterGain.connect(limiter);
        limiter.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSteelPanTone(freq) {
      initAudio();

      const now = audioCtx.currentTime;

      const carrier = audioCtx.createOscillator();
      const carrierGain = audioCtx.createGain();
      carrier.type = 'sine';
      carrier.frequency.setValueAtTime(freq, now);

      const overtone = audioCtx.createOscillator();
      const overtoneGain = audioCtx.createGain();
      overtone.type = 'sine';
      overtone.frequency.setValueAtTime(freq * 2.005, now);

      const duration = 1.2;

      carrierGain.gain.setValueAtTime(0, now);
      carrierGain.gain.linearRampToValueAtTime(0.85, now + 0.004);
      carrierGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      overtoneGain.gain.setValueAtTime(0, now);
      overtoneGain.gain.linearRampToValueAtTime(0.4, now + 0.002);
      overtoneGain.gain.exponentialRampToValueAtTime(0.001, now + duration * 0.4);

      carrier.connect(carrierGain);
      overtone.connect(overtoneGain);

      carrierGain.connect(masterGain);
      overtoneGain.connect(masterGain);

      carrier.start(now);
      overtone.start(now);
      carrier.stop(now + duration);
      overtone.stop(now + duration);
    }

    function renderLeadPads(container, notesArray) {
      notesArray.forEach((note, index) => {
        currentActiveNotes[index] = note;

        const pad = document.createElement('div');
        pad.className = `note-pad ${note.ring}`;
        pad.dataset.index = index;

        const label = document.createElement('span');
        label.className = 'note-label';
        label.textContent = showOctaves ? note.name : note.name.replace(/\d+/g, '');
        
        label.style.transform = `rotate(${-note.rotate}deg)`;
        pad.appendChild(label);

        const angleRad = (note.angle * Math.PI) / 180;
        const x = 50 + note.radius * Math.cos(angleRad);
        const y = 50 + note.radius * Math.sin(angleRad);

        pad.style.left = `${x}%`;
        pad.style.top = `${y}%`;
        pad.style.transform = `translate(-50%, -50%) rotate(${note.rotate}deg)`;

        container.appendChild(pad);
      });
    }

    function renderDoublesPads(container, notesArray, startIndex) {
      notesArray.forEach((note, localIdx) => {
        const globalIdx = startIndex + localIdx;
        currentActiveNotes[globalIdx] = note;

        const pad = document.createElement('div');
        pad.className = 'note-pad';
        pad.dataset.index = globalIdx;

        const label = document.createElement('span');
        label.className = 'note-label';
        label.textContent = showOctaves ? note.name : note.name.replace(/\d+/g, '');
        
        label.style.transform = `rotate(${-note.rot}deg)`;
        pad.appendChild(label);

        pad.style.left = `${note.x}%`;
        pad.style.top = `${note.y}%`;
        pad.style.width = `${note.w}%`;
        pad.style.height = `${note.h}%`;
        pad.style.fontSize = note.fontSize;
        pad.style.transform = `translate(-50%, -50%) rotate(${note.rot}deg)`;

        container.appendChild(pad);
      });
    }

    function polarToCartesian(cx, cy, r, angleInDegrees) {
      const angleInRadians = (angleInDegrees * Math.PI) / 180.0;
      return {
        x: cx + (r * Math.cos(angleInRadians)),
        y: cy + (r * Math.sin(angleInRadians))
      };
    }

    function describePieSector(cx, cy, innerR, outerR, startAngle, endAngle) {
      const p1 = polarToCartesian(cx, cy, outerR, startAngle);
      const p2 = polarToCartesian(cx, cy, outerR, endAngle);
      const p3 = polarToCartesian(cx, cy, innerR, endAngle);
      const p4 = polarToCartesian(cx, cy, innerR, startAngle);

      const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";

      return [
        "M", p1.x, p1.y,
        "A", outerR, outerR, 0, largeArcFlag, 1, p2.x, p2.y,
        "L", p3.x, p3.y,
        "A", innerR, innerR, 0, largeArcFlag, 0, p4.x, p4.y,
        "Z"
      ].join(" ");
    }

    function renderTriplesPads(container, outerNotes, innerNotes, startIndex) {
      const svgNS = "http://www.w3.org/2000/svg";
      
      outerNotes.forEach((note, localIdx) => {
        const globalIdx = startIndex + localIdx;
        currentActiveNotes[globalIdx] = note;

        const svg = document.createElementNS(svgNS, "svg");
        svg.setAttribute("class", "note-slice");
        svg.setAttribute("viewBox", "0 0 100 100");

        const pathD = describePieSector(50, 50, 24, 49, note.startA, note.endA);
        const path = document.createElementNS(svgNS, "path");
        path.setAttribute("d", pathD);
        path.dataset.index = globalIdx;

        const lblPos = polarToCartesian(50, 50, note.lblR, note.lblA);
        const text = document.createElementNS(svgNS, "text");
        text.setAttribute("x", lblPos.x);
        text.setAttribute("y", lblPos.y);
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("dominant-baseline", "central");
        text.setAttribute("font-size", "7");
        text.className.baseVal = "note-label";
        text.textContent = showOctaves ? note.name : note.name.replace(/\d+/g, '');

        svg.appendChild(path);
        svg.appendChild(text);
        container.appendChild(svg);
      });

      const innerStartIdx = startIndex + outerNotes.length;
      renderDoublesPads(container, innerNotes, innerStartIdx);
    }

    function renderBassPads(container, notesArray, startIndex) {
      const svgNS = "http://www.w3.org/2000/svg";
      
      notesArray.forEach((note, localIdx) => {
        const globalIdx = startIndex + localIdx;
        currentActiveNotes[globalIdx] = note;

        const svg = document.createElementNS(svgNS, "svg");
        svg.setAttribute("class", "note-slice");
        svg.setAttribute("viewBox", "0 0 100 100");

        const pathD = describePieSector(50, 50, 5, 48, note.startA, note.endA);
        const path = document.createElementNS(svgNS, "path");
        path.setAttribute("d", pathD);
        path.dataset.index = globalIdx;

        const lblPos = polarToCartesian(50, 50, note.lblR, note.lblA);
        const text = document.createElementNS(svgNS, "text");
        text.setAttribute("x", lblPos.x);
        text.setAttribute("y", lblPos.y);
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("dominant-baseline", "central");
        text.setAttribute("font-size", "10");
        text.className.baseVal = "note-label";
        text.textContent = showOctaves ? note.name : note.name.replace(/\d+/g, '');

        svg.appendChild(path);
        svg.appendChild(text);
        container.appendChild(svg);
      });
    }

    function renderLayout(type) {
      const stage = document.getElementById('panStage');
      const title = document.getElementById('drumTitle');
      const centerLabel = document.getElementById('layoutLabel');
      
      stage.innerHTML = '';
      currentActiveNotes = [];
      centerLabel.style.display = 'none';

      if (type === 'lead') {
        title.textContent = 'Lead Steel Pan';
        stage.className = 'pan-stage single-layout';

        const wrapper = document.createElement('div');
        wrapper.className = 'pan-wrapper';
        const pan = document.createElement('div');
        pan.className = 'steel-pan';
        wrapper.appendChild(pan);
        stage.appendChild(wrapper);

        renderLeadPads(pan, leadNotes);
      } else if (type === 'doubles') {
        title.textContent = 'Double Seconds Steel Pan';
        stage.className = 'pan-stage dual-layout';

        const wrapperLeft = document.createElement('div');
        wrapperLeft.className = 'pan-wrapper';
        const panLeft = document.createElement('div');
        panLeft.className = 'steel-pan';
        wrapperLeft.appendChild(panLeft);
        stage.appendChild(wrapperLeft);

        renderDoublesPads(panLeft, doublesLeftNotes, 0);

        const wrapperRight = document.createElement('div');
        wrapperRight.className = 'pan-wrapper';
        const panRight = document.createElement('div');
        panRight.className = 'steel-pan';
        wrapperRight.appendChild(panRight);
        stage.appendChild(wrapperRight);

        renderDoublesPads(panRight, doublesRightNotes, doublesLeftNotes.length);
      } else if (type === 'triples') {
        title.textContent = 'Triples Steel Pan';
        stage.className = 'pan-stage triple-layout';

        const w1 = document.createElement('div');
        w1.className = 'pan-wrapper';
        const p1 = document.createElement('div');
        p1.className = 'steel-pan';
        w1.appendChild(p1);
        stage.appendChild(w1);
        renderTriplesPads(p1, triplesLeftOuter, triplesLeftInner, 0);

        const w2 = document.createElement('div');
        w2.className = 'pan-wrapper';
        const p2 = document.createElement('div');
        p2.className = 'steel-pan';
        w2.appendChild(p2);
        stage.appendChild(w2);
        const idxOffset2 = triplesLeftOuter.length + triplesLeftInner.length;
        renderTriplesPads(p2, triplesMidOuter, triplesMidInner, idxOffset2);

        const w3 = document.createElement('div');
        w3.className = 'pan-wrapper';
        const p3 = document.createElement('div');
        p3.className = 'steel-pan';
        w3.appendChild(p3);
        stage.appendChild(w3);
        const idxOffset3 = idxOffset2 + triplesMidOuter.length + triplesMidInner.length;
        renderTriplesPads(p3, triplesRightOuter, triplesRightInner, idxOffset3);
      } else if (type === 'bass') {
        title.textContent = '6-Bass Steel Pan';
        stage.className = 'pan-stage bass-layout';
        centerLabel.style.display = 'block';

        let noteOffset = 0;
        bassPansNotes.forEach((panNotes) => {
          const wrapper = document.createElement('div');
          wrapper.className = 'pan-wrapper';
          const pan = document.createElement('div');
          pan.className = 'steel-pan';
          wrapper.appendChild(pan);
          stage.appendChild(wrapper);

          renderBassPads(pan, panNotes, noteOffset);
          noteOffset += panNotes.length;
        });
      }
    }

    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebarToggle');
    
    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
    });

    const drumButtons = document.querySelectorAll('.drum-btn');
    drumButtons.forEach((btn) => {
      btn.addEventListener('click', (e) => {
        drumButtons.forEach((b) => b.classList.remove('active'));
        e.target.classList.add('active');
        
        currentDrumType = e.target.dataset.drum;
        renderLayout(currentDrumType);
      });
    });

    const toggleOctaves = document.getElementById('toggleOctaves');
    toggleOctaves.addEventListener('change', (e) => {
      showOctaves = e.target.checked;
      const labels = document.querySelectorAll('.note-label');
      
      labels.forEach((label) => {
        const padElement = label.closest('.note-pad') || label.closest('.note-slice');
        if (!padElement) return;
        
        const targetElement = padElement.dataset.index !== undefined ? padElement : padElement.querySelector('path');
        if (!targetElement) return;

        const padIndex = targetElement.dataset.index;
        const noteObj = currentActiveNotes[padIndex];
        if (noteObj) {
          label.textContent = showOctaves ? noteObj.name : noteObj.name.replace(/\d+/g, '');
        }
      });
    });

    function triggerNote(targetElement) {
      if (!targetElement) return;
      const padElement = targetElement.closest('.note-pad') || targetElement.closest('path');
      if (!padElement) return;

      const padIndex = padElement.dataset.index;
      const noteData = currentActiveNotes[padIndex];
      if (noteData) {
        playSteelPanTone(noteData.freq);
      }

      padElement.classList.add('active');
      setTimeout(() => padElement.classList.remove('active'), 140);
    }

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#sidebar') || e.target.closest('#sidebarToggle')) return;
      triggerNote(e.target);
    });

    renderLayout('lead');
